services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-research-postgres
    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: ai_research
      POSTGRES_PASSWORD: ai_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8-alpine
    container_name: ai-research-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: