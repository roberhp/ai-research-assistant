services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-research-assistant-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_research:ai_research@postgres:5432/ai_research
      DATABASE_TEST_URL: postgresql+psycopg://ai_research:ai_research@postgres:5432/ai_research_test
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-research-postgres
    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: ai_research
      POSTGRES_PASSWORD: ai_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_research -d ai_research"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ai-research-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: