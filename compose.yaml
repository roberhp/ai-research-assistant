services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-research-postgres
    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: ai_research
      POSTGRES_PASSWORD: ai_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: